<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qonverse</title>
<meta name="description" content="Learn the short spoken phrases your job needs, in any language.">
<meta name="theme-color" content="#7464B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qonverse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg class="cubes" aria-hidden="true"><defs><pattern id="cube" width="29.445" height="51" patternUnits="userSpaceOnUse"><path id="cubepath" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></pattern></defs><rect width="100%" height="100%" fill="url(#cube)"/></svg>
<main id="app" aria-live="polite"></main>
<div id="install" class="install" hidden></div>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    reg.update();
    reg.addEventListener('updatefound', function () {
      var w = reg.installing;
      if (w) w.addEventListener('statechange', function () {
        if (w.state === 'installed' && navigator.serviceWorker.controller) window.QV && QV.toast('Qonverse was updated — it will use the new version next time you open it.');
      });
    });
  }).catch(function () {});
}
</script>
</body>
</html>
