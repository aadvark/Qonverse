name: Build APK

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sample packs
        run: |
          pip install jsonschema
          python3 -c "import json,glob,jsonschema; s=json.load(open('schema/pack.schema.json')); [jsonschema.validate(json.load(open(f)), s) for f in glob.glob('packs/*.json')]; print('packs ok')"
      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME is set).
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Qonverse-apk
          path: app/build/outputs/apk/release/app-release.apk
