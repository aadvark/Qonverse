name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Validate sample packs
        run: |
          pip install jsonschema
          python3 -c "import json,glob,jsonschema; s=json.load(open('schema/pack.schema.json')); [jsonschema.validate(json.load(open(f)), s) for f in glob.glob('packs/*.json')]; print('packs ok')"
      - name: Build release APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Qonverse-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
